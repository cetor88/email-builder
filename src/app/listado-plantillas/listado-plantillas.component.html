<mat-form-field>
  <mat-label>Filter</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
</mat-form-field>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.id}} </td>
    </ng-container>

    <!-- Progress Column -->
    <ng-container matColumnDef="plantilla">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Plantilla </th>
      <td mat-cell *matCellDef="let row"> {{row.name}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="ramo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Ramo </th>
      <td mat-cell *matCellDef="let row"> {{row.ramo}} </td>
    </ng-container>

    <!-- Fruit Column -->
    <ng-container matColumnDef="fechaCreacion">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha de creación </th>
      <td mat-cell *matCellDef="let row"> {{row.fechaCreacion}} </td>
    </ng-container>

    <!-- Fruit Column -->
    <ng-container matColumnDef="previo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Preview </th>
      <td mat-cell *matCellDef="let row">
        <button (click)="prevewTemplate()">
          <mat-icon aria-hidden="false" aria-label="start" fontIcon="start"/>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
</div>

<ng-template  #dialogPreview>
  <h2 mat-dialog-title>Vista Previa</h2>
  <mat-dialog-content>

    <img [src]="rutaPlantilla" alt="plantilla"/>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</ng-template>
